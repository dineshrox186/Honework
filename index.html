<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Student Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4;
    --paper-raised:#FFFFFF;
    --ink:#1E2A22;
    --ink-soft:#5C6B60;
    --ink-faint:#94A399;
    --rule:#E1DCCC;
    --margin:#BE5A52;
    --accent:#2C4A3E;
    --accent-dark:#1D332A;
    --accent-soft:#E7EFE9;
    --maths:#33517D;
    --maths-soft:#E7ECF4;
    --physics:#A8672A;
    --physics-soft:#F6ECDF;
    --chem:#3E7D5C;
    --chem-soft:#E6F1EA;
    --danger:#B23A34;
    --danger-soft:#F8E9E7;
    --ok:#2E7D4F;
    --radius:10px;
    --radius-lg:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  ::selection{background:var(--accent-soft);}

  button, a, input, .checkbox-btn, .student-name{
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
  }
  input{ -webkit-user-select:text; user-select:text; }
  button:focus, .checkbox-btn:focus, .student-name:focus{ outline:none; }
  button:focus-visible, .checkbox-btn:focus-visible, .student-name:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* ---------- Top header ---------- */
  header.app-header{
    background:var(--paper-raised);
    border-bottom:1px solid var(--rule);
    padding:22px 18px 18px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .header-inner{
    max-width:760px;
    margin:0 auto;
    position:relative;
    padding-left:16px;
  }
  .header-inner::before{
    content:"";
    position:absolute;
    left:0;
    top:2px;
    bottom:2px;
    width:2px;
    background:var(--margin);
    opacity:.55;
  }
  h1.title{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 18px;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .field-group{
    display:flex;
    gap:8px;
    align-items:center;
  }
  input[type="text"], input[type="date"]{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--rule);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  input[type="text"]:focus, input[type="date"]:focus{
    border-color:var(--accent);
    background:#fff;
  }
  #newStudentName{ flex:1; min-width:140px; }

  button{ font-family:'Inter',sans-serif; cursor:pointer; appearance:none; -webkit-appearance:none; background-color:transparent; }
  .btn{
    border:none;
    border-radius:var(--radius);
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink);
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-danger:hover{ background:#8f2d28; }
  .btn-sm{ padding:7px 12px; font-size:13px; }

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:18px 28px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--rule);
  }
  .meta-item label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:5px;
  }
  .week-range{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    margin-left:8px;
  }

  /* ---------- Main list ---------- */
  main{
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 40px;
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:'Source Serif 4',serif;
    font-size:20px;
    color:var(--ink);
    margin-bottom:6px;
  }

  .student-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-lg);
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
    padding:16px 16px 14px 22px;
  }
  .student-card::before{
    content:"";
    position:absolute;
    left:12px;
    top:0;
    bottom:0;
    width:2px;
    background:var(--margin);
    opacity:.4;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .student-name{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:19px;
    cursor:pointer;
    padding:2px 4px;
    border-radius:6px;
  }
  .student-name:hover{ background:var(--accent-soft); }
  .name-edit-input{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:19px;
    border:1px solid var(--accent);
    border-radius:6px;
    padding:2px 6px;
    background:#fff;
    width:180px;
  }
  .card-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }

  .subject-block{ margin-bottom:10px; }
  .subject-block:last-child{ margin-bottom:0; }
  .block-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:8px;
  }
  .subject-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .subject-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:10px 6px 8px;
    border-radius:10px;
    border:1px solid var(--rule);
    background:var(--paper);
  }
  .subject-cell .subj-name{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .subject-cell.maths .subj-name{ color:var(--maths); }
  .subject-cell.physics .subj-name{ color:var(--physics); }
  .subject-cell.chem .subj-name{ color:var(--chem); }

  .checkbox-btn{
    width:46px;
    height:46px;
    border-radius:9px;
    border:2px solid var(--rule);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .06s ease, background .12s ease, border-color .12s ease;
  }
  .checkbox-btn:active{ transform:scale(.93); }
  .checkbox-btn svg{ width:24px; height:24px; opacity:0; transition:opacity .1s ease; }
  .checkbox-btn.checked svg{ opacity:1; }
  .checkbox-btn.checked.maths{ background:var(--maths); border-color:var(--maths); }
  .checkbox-btn.checked.physics{ background:var(--physics); border-color:var(--physics); }
  .checkbox-btn.checked.chem{ background:var(--chem); border-color:var(--chem); }

  /* ---------- Records page ---------- */
  .records-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .back-link{
    background:none;
    border:none;
    color:var(--accent);
    font-weight:600;
    font-size:14px;
    padding:8px 4px;
  }
  .records-title{
    font-family:'Source Serif 4',serif;
    font-size:24px;
    font-weight:700;
  }
  .section-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-lg);
    padding:18px 16px;
    margin-bottom:16px;
  }
  .section-title{
    font-family:'Source Serif 4',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 12px;
  }
  .table-wrap{ overflow-x:auto; }
  table.reg-table{
    width:100%;
    border-collapse:collapse;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    min-width:360px;
  }
  table.reg-table th, table.reg-table td{
    padding:9px 8px;
    text-align:center;
    border-bottom:1px solid var(--rule);
  }
  table.reg-table th{
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.05em;
    color:var(--ink-faint);
    font-weight:600;
  }
  table.reg-table td:first-child, table.reg-table th:first-child{
    text-align:left;
    color:var(--ink-soft);
  }
  .mark{ display:inline-flex; width:20px; height:20px; border-radius:5px; align-items:center; justify-content:center; }
  .mark.yes{ background:var(--chem-soft); color:var(--ok); }
  .mark.no{ background:var(--danger-soft); color:var(--danger); }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:14px;
  }
  @media (min-width:480px){ .stats-row{ grid-template-columns:repeat(4,1fr);} }
  .stat-box{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:10px 8px;
    text-align:center;
  }
  .stat-box .num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:16px;
  }
  .stat-box.maths .num{ color:var(--maths); }
  .stat-box.physics .num{ color:var(--physics); }
  .stat-box.chem .num{ color:var(--chem); }
  .stat-box .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-top:3px; }

  .no-data{ color:var(--ink-faint); font-size:13px; padding:6px 0; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,26,22,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:#fff;
    border-radius:var(--radius-lg);
    padding:22px;
    max-width:320px;
    width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
  }
  .modal-box p{
    font-size:15px;
    line-height:1.5;
    margin:0 0 18px;
  }
  .modal-box .stu-name{ font-weight:700; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

  @media (max-width:420px){
    h1.title{ font-size:24px; }
    .checkbox-btn{ width:40px; height:40px; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <h1 class="title">Student Tracker</h1>
    <p class="subtitle">Daily homework &amp; weekly error notes — class register</p>

    <div class="controls">
      <div class="field-group" style="flex:1; min-width:220px;">
        <input type="text" id="newStudentName" placeholder="Student name" maxlength="40">
        <button class="btn btn-primary" id="addStudentBtn">Add Student</button>
      </div>
    </div>

    <div class="meta-row">
      <div class="meta-item">
        <label>Homework Date</label>
        <input type="date" id="hwDate">
      </div>
      <div class="meta-item">
        <label>Error Notes Week</label>
        <input type="date" id="enWeekPicker">
        <span class="week-range" id="weekRangeDisplay"></span>
      </div>
    </div>
  </div>
</header>

<main id="mainView">
  <div id="studentList"></div>
</main>

<main id="recordsView" style="display:none;"></main>

<div class="modal-overlay" id="removeModal">
  <div class="modal-box">
    <p>Remove <span class="stu-name" id="removeModalName"></span>?<br>This will remove the student and their records.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" id="cancelRemoveBtn">Cancel</button>
      <button class="btn btn-danger btn-sm" id="confirmRemoveBtn">Remove</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Storage ---------------- */
  const LS_STUDENTS = 'st_students';
  const LS_HOMEWORK = 'st_homework';
  const LS_ERRORNOTES = 'st_errornotes';

  function load(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  let students = load(LS_STUDENTS, []);
  let homework = load(LS_HOMEWORK, []);
  let errorNotes = load(LS_ERRORNOTES, []);

  function saveStudents(){ save(LS_STUDENTS, students); }
  function saveHomework(){ save(LS_HOMEWORK, homework); }
  function saveErrorNotes(){ save(LS_ERRORNOTES, errorNotes); }

  function uid(){ return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------------- Date helpers ---------------- */
  function todayISO(){
    const d = new Date();
    return isoFromDate(d);
  }
  function isoFromDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function dateFromISO(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function getMonday(iso){
    const d = dateFromISO(iso);
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = (day === 0 ? -6 : 1 - day); // shift to Monday
    d.setDate(d.getDate() + diff);
    return isoFromDate(d);
  }
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatShort(iso){
    const d = dateFromISO(iso);
    return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  }
  function formatWeekRange(mondayIso){
    const start = dateFromISO(mondayIso);
    const end = new Date(start); end.setDate(end.getDate()+6);
    const sM = MONTHS[start.getMonth()], eM = MONTHS[end.getMonth()];
    if(sM === eM){
      return `${sM} ${start.getDate()} – ${end.getDate()}`;
    }
    return `${sM} ${start.getDate()} – ${eM} ${end.getDate()}`;
  }

  /* ---------------- State ---------------- */
  let currentDate = todayISO();
  let currentWeek = getMonday(currentDate);
  let editingStudentId = null;
  let view = 'main';
  let recordsStudentId = null;
  let pendingRemoveId = null;

  /* ---------------- Record accessors ---------------- */
  function getHomework(studentId, date){
    return homework.find(r => r.student_id === studentId && r.date === date);
  }
  function setHomework(studentId, date, subject, value){
    let rec = getHomework(studentId, date);
    if(!rec){
      rec = { student_id: studentId, date: date, maths:false, physics:false, chemistry:false };
      homework.push(rec);
    }
    rec[subject] = value;
    saveHomework();
  }
  function getErrorNote(studentId, week){
    return errorNotes.find(r => r.student_id === studentId && r.week === week);
  }
  function setErrorNote(studentId, week, subject, value){
    let rec = getErrorNote(studentId, week);
    if(!rec){
      rec = { student_id: studentId, week: week, maths:false, physics:false, chemistry:false };
      errorNotes.push(rec);
    }
    rec[subject] = value;
    saveErrorNotes();
  }

  /* ---------------- Icons ---------------- */
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,13 9,18 20,6"></polyline></svg>';

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  /* ---------------- Rendering: main list ---------------- */
  function checkboxCell(subjectKey, subjClass, subjLabel, checked, dataAttrs){
    return `
      <div class="subject-cell ${subjClass}">
        <span class="subj-name">${subjLabel}</span>
        <button class="checkbox-btn ${subjClass} ${checked?'checked':''}" ${dataAttrs} aria-pressed="${checked}">
          ${CHECK_SVG}
        </button>
      </div>`;
  }

  function studentCardHtml(stu){
    const hw = getHomework(stu.id, currentDate) || {maths:false, physics:false, chemistry:false};
    const en = getErrorNote(stu.id, currentWeek) || {maths:false, physics:false, chemistry:false};

    const nameHtml = editingStudentId === stu.id
      ? `<input type="text" class="name-edit-input" id="nameEditInput" value="${escapeHtml(stu.name)}" maxlength="40">`
      : `<span class="student-name" data-action="edit-name" data-student="${stu.id}">${escapeHtml(stu.name)}</span>`;

    return `
    <div class="student-card">
      <div class="card-head">
        ${nameHtml}
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" data-action="open-records" data-student="${stu.id}">Records</button>
          <button class="btn btn-ghost btn-sm" data-action="remove-student" data-student="${stu.id}" title="Remove">🗑</button>
        </div>
      </div>

      <div class="subject-block">
        <div class="block-label">Homework — ${formatShort(currentDate)}</div>
        <div class="subject-grid">
          ${checkboxCell('maths','maths','Maths', hw.maths, `data-action="toggle-hw" data-student="${stu.id}" data-subject="maths"`)}
          ${checkboxCell('physics','physics','Physics', hw.physics, `data-action="toggle-hw" data-student="${stu.id}" data-subject="physics"`)}
          ${checkboxCell('chemistry','chem','Chemistry', hw.chemistry, `data-action="toggle-hw" data-student="${stu.id}" data-subject="chemistry"`)}
        </div>
      </div>

      <div class="subject-block">
        <div class="block-label">Error Notes — ${formatWeekRange(currentWeek)}</div>
        <div class="subject-grid">
          ${checkboxCell('maths','maths','Maths', en.maths, `data-action="toggle-en" data-student="${stu.id}" data-subject="maths"`)}
          ${checkboxCell('physics','physics','Physics', en.physics, `data-action="toggle-en" data-student="${stu.id}" data-subject="physics"`)}
          ${checkboxCell('chemistry','chem','Chemistry', en.chemistry, `data-action="toggle-en" data-student="${stu.id}" data-subject="chemistry"`)}
        </div>
      </div>
    </div>`;
  }

  function renderMain(){
    const list = document.getElementById('studentList');
    if(students.length === 0){
      list.innerHTML = `<div class="empty-state">
        <div class="big">No students yet</div>
        <div>Add your first student above to start the register.</div>
      </div>`;
      return;
    }
    list.innerHTML = students.map(studentCardHtml).join('');
    if(editingStudentId){
      const input = document.getElementById('nameEditInput');
      if(input){
        input.focus();
        input.select();
      }
    }
  }

  /* ---------------- Rendering: records page ---------------- */
  function markHtml(bool){
    return bool
      ? `<span class="mark yes">✓</span>`
      : `<span class="mark no">✕</span>`;
  }

  function renderRecords(stu){
    const hwRecords = homework
      .filter(r => r.student_id === stu.id)
      .sort((a,b) => b.date.localeCompare(a.date));

    const enRecords = errorNotes
      .filter(r => r.student_id === stu.id)
      .sort((a,b) => b.week.localeCompare(a.week));

    // stats
    let mSum=0,pSum=0,cSum=0;
    hwRecords.forEach(r=>{ if(r.maths)mSum++; if(r.physics)pSum++; if(r.chemistry)cSum++; });
    const hwTotal = hwRecords.length;
    const overallSum = mSum+pSum+cSum;
    const overallTotal = hwTotal*3;

    let mW=0,pW=0,cW=0;
    enRecords.forEach(r=>{ if(r.maths)mW++; if(r.physics)pW++; if(r.chemistry)cW++; });
    const enTotal = enRecords.length;

    const hwRows = hwRecords.length
      ? hwRecords.map(r => `
        <tr>
          <td>${formatShort(r.date)}</td>
          <td>${markHtml(r.maths)}</td>
          <td>${markHtml(r.physics)}</td>
          <td>${markHtml(r.chemistry)}</td>
        </tr>`).join('')
      : `<tr><td colspan="4" class="no-data">No homework recorded yet.</td></tr>`;

    const enRows = enRecords.length
      ? enRecords.map(r => `
        <tr>
          <td>${formatWeekRange(r.week)}</td>
          <td>${markHtml(r.maths)}</td>
          <td>${markHtml(r.physics)}</td>
          <td>${markHtml(r.chemistry)}</td>
        </tr>`).join('')
      : `<tr><td colspan="4" class="no-data">No error notes recorded yet.</td></tr>`;

    const view = document.getElementById('recordsView');
    view.innerHTML = `
      <div class="records-header">
        <button class="back-link" id="backBtn" data-action="back">← Back</button>
        <div class="records-title">${escapeHtml(stu.name)} — Records</div>
      </div>

      <div class="section-card">
        <div class="section-title">Homework History</div>
        <div class="table-wrap">
          <table class="reg-table">
            <thead><tr><th>Date</th><th>Maths</th><th>Physics</th><th>Chemistry</th></tr></thead>
            <tbody>${hwRows}</tbody>
          </table>
        </div>
        <div class="stats-row">
          <div class="stat-box maths"><div class="num">${mSum}/${hwTotal}</div><div class="lbl">Maths</div></div>
          <div class="stat-box physics"><div class="num">${pSum}/${hwTotal}</div><div class="lbl">Physics</div></div>
          <div class="stat-box chem"><div class="num">${cSum}/${hwTotal}</div><div class="lbl">Chemistry</div></div>
          <div class="stat-box"><div class="num">${overallSum}/${overallTotal}</div><div class="lbl">Overall</div></div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-title">Error Notes History</div>
        <div class="table-wrap">
          <table class="reg-table">
            <thead><tr><th>Week</th><th>Maths</th><th>Physics</th><th>Chemistry</th></tr></thead>
            <tbody>${enRows}</tbody>
          </table>
        </div>
        <div class="stats-row">
          <div class="stat-box maths"><div class="num">${mW}/${enTotal}</div><div class="lbl">Maths weeks</div></div>
          <div class="stat-box physics"><div class="num">${pW}/${enTotal}</div><div class="lbl">Physics weeks</div></div>
          <div class="stat-box chem"><div class="num">${cW}/${enTotal}</div><div class="lbl">Chemistry weeks</div></div>
        </div>
      </div>
    `;
  }

  function showMain(){
    view = 'main';
    document.getElementById('mainView').style.display = '';
    document.getElementById('recordsView').style.display = 'none';
    renderMain();
  }
  function showRecords(studentId){
    const stu = students.find(s => s.id === studentId);
    if(!stu) return;
    view = 'records';
    recordsStudentId = studentId;
    document.getElementById('mainView').style.display = 'none';
    document.getElementById('recordsView').style.display = '';
    renderRecords(stu);
  }

  /* ---------------- Header controls ---------------- */
  function updateWeekRangeDisplay(){
    document.getElementById('weekRangeDisplay').textContent = formatWeekRange(currentWeek);
  }

  document.getElementById('hwDate').value = currentDate;
  document.getElementById('enWeekPicker').value = currentWeek;
  updateWeekRangeDisplay();

  document.getElementById('hwDate').addEventListener('change', e => {
    currentDate = e.target.value || todayISO();
    if(view === 'main') renderMain();
  });

  document.getElementById('enWeekPicker').addEventListener('change', e => {
    const val = e.target.value || todayISO();
    currentWeek = getMonday(val);
    updateWeekRangeDisplay();
    if(view === 'main') renderMain();
  });

  function addStudent(){
    const input = document.getElementById('newStudentName');
    const name = input.value.trim();
    if(!name) return;
    students.push({ id: uid(), name: name });
    saveStudents();
    input.value = '';
    renderMain();
  }
  document.getElementById('addStudentBtn').addEventListener('click', addStudent);
  document.getElementById('newStudentName').addEventListener('keydown', e => {
    if(e.key === 'Enter') addStudent();
  });

  /* ---------------- Remove modal ---------------- */
  const removeModal = document.getElementById('removeModal');
  function openRemoveModal(studentId){
    const stu = students.find(s => s.id === studentId);
    if(!stu) return;
    pendingRemoveId = studentId;
    document.getElementById('removeModalName').textContent = stu.name;
    removeModal.classList.add('open');
  }
  function closeRemoveModal(){
    removeModal.classList.remove('open');
    pendingRemoveId = null;
  }
  document.getElementById('cancelRemoveBtn').addEventListener('click', closeRemoveModal);
  document.getElementById('confirmRemoveBtn').addEventListener('click', () => {
    if(!pendingRemoveId) return;
    students = students.filter(s => s.id !== pendingRemoveId);
    homework = homework.filter(r => r.student_id !== pendingRemoveId);
    errorNotes = errorNotes.filter(r => r.student_id !== pendingRemoveId);
    saveStudents(); saveHomework(); saveErrorNotes();
    closeRemoveModal();
    renderMain();
  });
  removeModal.addEventListener('click', e => {
    if(e.target === removeModal) closeRemoveModal();
  });

  /* ---------------- Name editing ---------------- */
  function commitNameEdit(studentId, newName){
    const stu = students.find(s => s.id === studentId);
    if(stu){
      const trimmed = newName.trim();
      if(trimmed) stu.name = trimmed;
      saveStudents();
    }
    editingStudentId = null;
    renderMain();
  }

  /* ---------------- Event delegation ---------------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;
    const studentId = t.dataset.student;

    if(action === 'toggle-hw'){
      const subject = t.dataset.subject;
      const rec = getHomework(studentId, currentDate);
      const current = rec ? rec[subject] : false;
      setHomework(studentId, currentDate, subject, !current);
      renderMain();
    } else if(action === 'toggle-en'){
      const subject = t.dataset.subject;
      const rec = getErrorNote(studentId, currentWeek);
      const current = rec ? rec[subject] : false;
      setErrorNote(studentId, currentWeek, subject, !current);
      renderMain();
    } else if(action === 'open-records'){
      showRecords(studentId);
    } else if(action === 'remove-student'){
      openRemoveModal(studentId);
    } else if(action === 'edit-name'){
      editingStudentId = studentId;
      renderMain();
    } else if(action === 'back'){
      showMain();
    }
  });

  document.addEventListener('keydown', e => {
    if(e.target && e.target.id === 'nameEditInput'){
      if(e.key === 'Enter'){
        commitNameEdit(editingStudentId, e.target.value);
      } else if(e.key === 'Escape'){
        editingStudentId = null;
        renderMain();
      }
    }
  });
  document.addEventListener('blur', e => {
    if(e.target && e.target.id === 'nameEditInput'){
      commitNameEdit(editingStudentId, e.target.value);
    }
  }, true);

  /* ---------------- Init ---------------- */
  renderMain();
})();
</script>
</body>
</html>
