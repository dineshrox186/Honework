<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Student Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4;
    --paper-raised:#FFFFFF;
    --ink:#1E2A22;
    --ink-soft:#5C6B60;
    --ink-faint:#94A399;
    --rule:#E1DCCC;
    --margin:#BE5A52;
    --accent:#2C4A3E;
    --accent-dark:#1D332A;
    --accent-soft:#E7EFE9;
    --maths:#33517D;
    --maths-soft:#E7ECF4;
    --physics:#A8672A;
    --physics-soft:#F6ECDF;
    --chem:#3E7D5C;
    --chem-soft:#E6F1EA;
    --danger:#B23A34;
    --danger-soft:#F8E9E7;
    --ok:#2E7D4F;
    --radius:10px;
    --radius-lg:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  ::selection{background:var(--accent-soft);}

  button, a, input, .checkbox-btn, .student-name{
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
  }
  input{ -webkit-user-select:text; user-select:text; }
  button:focus, .checkbox-btn:focus, .student-name:focus{ outline:none; }
  button:focus-visible, .checkbox-btn:focus-visible, .student-name:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* ---------- Top header ---------- */
  header.app-header{
    background:var(--paper-raised);
    border-bottom:1px solid var(--rule);
    padding:22px 18px 18px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .header-inner{
    max-width:760px;
    margin:0 auto;
    position:relative;
    padding-left:16px;
  }
  .header-inner::before{
    content:"";
    position:absolute;
    left:0;
    top:2px;
    bottom:2px;
    width:2px;
    background:var(--margin);
    opacity:.55;
  }
  h1.title{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 18px;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .field-group{
    display:flex;
    gap:8px;
    align-items:center;
  }
  input[type="text"], input[type="date"]{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--rule);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  input[type="text"]:focus, input[type="date"]:focus{
    border-color:var(--accent);
    background:#fff;
  }
  #newStudentName{ flex:1; min-width:140px; }

  button{ font-family:'Inter',sans-serif; cursor:pointer; appearance:none; -webkit-appearance:none; background-color:transparent; }
  .btn{
    border:none;
    border-radius:var(--radius);
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink);
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-danger:hover{ background:#8f2d28; }
  .btn-sm{ padding:7px 12px; font-size:13px; }

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:18px 28px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--rule);
  }
  .meta-item label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:5px;
  }
  .week-range{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    margin-left:8px;
  }

  /* ---------- Main list ---------- */
  main{
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 40px;
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:'Source Serif 4',serif;
    font-size:20px;
    color:var(--ink);
    margin-bottom:6px;
  }

  .student-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-lg);
    margin-bottom:14px;
    position:relative;
    padding:0 16px 14px 22px;
  }
  .student-card::before{
    content:"";
    position:absolute;
    left:12px;
    top:0;
    bottom:0;
    width:2px;
    background:var(--margin);
    opacity:.4;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    position:sticky;
    top:0;
    z-index:5;
    background:var(--paper-raised);
    margin:0 -16px 14px -22px;
    padding:16px 16px 10px 22px;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow:0 1px 0 var(--rule);
  }
  .student-name{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:19px;
    cursor:pointer;
    padding:2px 4px;
    border-radius:6px;
  }
  .student-name:hover{ background:var(--accent-soft); }
  .name-edit-input{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:19px;
    border:1px solid var(--accent);
    border-radius:6px;
    padding:2px 6px;
    background:#fff;
    width:180px;
  }
  .card-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }

  .subject-block{ margin-bottom:10px; }
  .subject-block:last-child{ margin-bottom:0; }
  .block-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:8px;
  }
  .subject-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .subject-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:10px 6px 8px;
    border-radius:10px;
    border:1px solid var(--rule);
    background:var(--paper);
  }
  .subject-cell .subj-name{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .subject-cell.maths .subj-name{ color:var(--maths); }
  .subject-cell.physics .subj-name{ color:var(--physics); }
  .subject-cell.chem .subj-name{ color:var(--chem); }

  .checkbox-btn{
    width:46px;
    height:46px;
    border-radius:9px;
    border:2px solid var(--rule);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .06s ease, background .12s ease, border-color .12s ease;
  }
  .checkbox-btn:active{ transform:scale(.93); }
  .checkbox-btn svg{ width:24px; height:24px; opacity:0; transition:opacity .1s ease; }
  .checkbox-btn.checked svg{ opacity:1; }
  .checkbox-btn.checked.maths{ background:var(--maths); border-color:var(--maths); }
  .checkbox-btn.checked.physics{ background:var(--physics); border-color:var(--physics); }
  .checkbox-btn.checked.chem{ background:var(--chem); border-color:var(--chem); }

  .subj-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
  }

  /* ---------- Records page ---------- */
  .records-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .back-link{
    background:none;
    border:none;
    color:var(--accent);
    font-weight:600;
    font-size:14px;
    padding:8px 4px;
  }
  .records-title{
    font-family:'Source Serif 4',serif;
    font-size:24px;
    font-weight:700;
  }
  .section-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-lg);
    padding:18px 16px;
    margin-bottom:16px;
  }
  .section-title{
    font-family:'Source Serif 4',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 12px;
  }
  .table-wrap{ overflow-x:auto; }
  table.reg-table{
    width:100%;
    border-collapse:collapse;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    min-width:360px;
  }
  table.reg-table th, table.reg-table td{
    padding:9px 8px;
    text-align:center;
    border-bottom:1px solid var(--rule);
  }
  table.reg-table th{
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.05em;
    color:var(--ink-faint);
    font-weight:600;
  }
  table.reg-table td:first-child, table.reg-table th:first-child{
    text-align:left;
    color:var(--ink-soft);
  }
  .mark{ display:inline-flex; width:20px; height:20px; border-radius:5px; align-items:center; justify-content:center; }
  .mark.yes{ background:var(--chem-soft); color:var(--ok); }
  .mark.no{ background:var(--danger-soft); color:var(--danger); }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:14px;
  }
  @media (min-width:480px){ .stats-row{ grid-template-columns:repeat(4,1fr);} }
  .stat-box{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:10px 8px;
    text-align:center;
  }
  .stat-box .num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:16px;
  }
  .stat-box.maths .num{ color:var(--maths); }
  .stat-box.physics .num{ color:var(--physics); }
  .stat-box.chem .num{ color:var(--chem); }
  .stat-box .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-top:3px; }

  .no-data{ color:var(--ink-faint); font-size:13px; padding:6px 0; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,26,22,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:#fff;
    border-radius:var(--radius-lg);
    padding:22px;
    max-width:320px;
    width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
  }
  .modal-box p{
    font-size:15px;
    line-height:1.5;
    margin:0 0 18px;
  }
  .modal-box .stu-name{ font-weight:700; }
  .modal-box .stu-subject{ font-weight:700; }

  .count-stepper{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin:6px 0 14px;
  }
  .count-step-btn{
    width:44px;
    height:44px;
    flex-shrink:0;
    border-radius:50%;
    border:2px solid var(--rule);
    background:#fff;
    font-size:22px;
    font-weight:700;
    line-height:1;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .12s ease, border-color .12s ease, transform .06s ease, opacity .12s ease;
  }
  .count-step-btn:active{ transform:scale(.9); }
  .count-step-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent-dark); }
  .count-step-btn:disabled{ opacity:.35; }

  .count-input{
    width:96px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:34px;
    font-weight:700;
    color:var(--ink);
    border:none;
    border-bottom:2px solid var(--rule);
    border-radius:0;
    padding:2px 0 6px;
    background:transparent;
    -moz-appearance:textfield;
  }
  .count-input::-webkit-outer-spin-button,
  .count-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .count-input:focus{ border-bottom-color:var(--accent); }

  .count-quick-row{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .count-quick-btn{
    padding:7px 15px;
    border-radius:999px;
    border:1px solid var(--rule);
    background:var(--paper);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    transition:background .12s ease, border-color .12s ease, color .12s ease;
  }
  .count-quick-btn:hover{ border-color:var(--accent); color:var(--accent-dark); }
  .count-quick-btn.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .modal-box .field-error{
    color:var(--danger);
    font-size:12px;
    margin:0 0 12px;
    text-align:center;
    display:none;
  }
  .modal-box .field-error.show{ display:block; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

  @media (max-width:420px){
    h1.title{ font-size:24px; }
    .checkbox-btn{ width:40px; height:40px; }
  }

  /* ---------- Backup banner ---------- */
  .banner{
    max-width:760px;
    margin:14px auto 0;
    padding:12px 14px;
    border-radius:var(--radius);
    font-size:13px;
    line-height:1.45;
    display:none;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
  }
  .banner.show{ display:flex; }
  .banner-error{ background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger); }
  .banner-warn{ background:#FBF3D6; color:#6B5A12; border:1px solid #E3C765; }
  .banner-info{ background:var(--accent-soft); color:var(--accent-dark); border:1px solid var(--accent); }
  .banner-actions{ display:flex; gap:8px; flex-shrink:0; }
  .banner button.btn{ padding:6px 12px; font-size:12px; }
  .banner .banner-dismiss{
    background:transparent; border:none; color:inherit; font-weight:700;
    padding:4px 6px; font-size:14px; cursor:pointer; line-height:1;
  }

  /* ---------- Import/Export controls ---------- */
  .io-controls{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- Top bar (always visible): search + menu toggle ---------- */
  .top-bar{
    display:flex;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .top-search{ flex:1; min-width:160px; }
  .menu-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }
  .menu-toggle[aria-expanded="true"]{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent-dark);
  }

  /* ---------- Collapsible menu panel (animated) ---------- */
  .menu-panel{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .menu-panel.open{ grid-template-rows:1fr; }

  .menu-panel-inner{
    overflow:hidden;
    min-height:0;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--rule);
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .menu-panel.open .menu-panel-inner{
    opacity:1;
    transform:translateY(0);
    transition:opacity .25s ease .1s, transform .25s ease .1s;
  }

  .menu-nav-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
  }

  /* ---------- Hamburger ↔ close icon ---------- */
  .hamburger{
    display:inline-flex;
    flex-direction:column;
    justify-content:center;
    gap:4px;
    width:16px;
    height:14px;
  }
  .hamburger .bar{
    display:block;
    height:2px;
    width:100%;
    background:currentColor;
    border-radius:1px;
    transition:transform .25s ease, opacity .2s ease;
    transform-origin:center;
  }
  .menu-toggle[aria-expanded="true"] .hamburger .bar:nth-child(1){ transform:translateY(6px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] .hamburger .bar:nth-child(2){ opacity:0; }
  .menu-toggle[aria-expanded="true"] .hamburger .bar:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }

  .autosave-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    font-size:13px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .autosave-status.on::before{ content:'🟢 '; }
  .autosave-status.off::before{ content:'⚪ '; }
  .autosave-status.needs-permission::before{ content:'🟡 '; }
  .autosave-status.unsupported::before{ content:'⚪ '; }
  .autosave-status.error::before{ content:'🔴 '; }

  .reg-table tr.flag-row{ background:var(--danger-soft); }
  .reg-table tr.flag-row td:first-child{ font-weight:600; }

  /* ---------- Pending page ---------- */
  .pending-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:6px;
  }
  .pending-sub{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 18px;
  }
  .pending-subject-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-lg);
    padding:16px;
    margin-bottom:14px;
  }
  .pending-subject-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .pending-subject-title{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:16px;
  }
  .pending-subject-card.maths .pending-subject-title{ color:var(--maths); }
  .pending-subject-card.physics .pending-subject-title{ color:var(--physics); }
  .pending-subject-card.chem .pending-subject-title{ color:var(--chem); }
  .pending-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    background:var(--paper);
    border:1px solid var(--rule);
    color:var(--ink-soft);
  }
  .pending-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .pending-list li{
    font-size:13px;
    padding:7px 11px;
    border-radius:8px;
    background:var(--paper);
    border:1px solid var(--rule);
  }
  .pending-subject-card.maths .pending-list li{ border-color:var(--maths-soft); }
  .pending-subject-card.physics .pending-list li{ border-color:var(--physics-soft); }
  .pending-subject-card.chem .pending-list li{ border-color:var(--chem-soft); }
  .pending-all-clear{
    color:var(--ink-faint);
    font-size:13px;
    padding:4px 0;
  }
  .pending-section-title{
    font-family:'Source Serif 4',serif;
    font-size:19px;
    font-weight:600;
    margin:22px 0 12px;
  }
  .pending-section-title:first-of-type{ margin-top:0; }

  /* ---------- Dashboard ---------- */
  .dash-stats-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .dash-stat-card{
    flex:1;
    min-width:150px;
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-lg);
    padding:16px;
  }
  .dash-stat-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .dash-stat-value{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:34px;
    line-height:1;
    color:var(--ink);
    margin-bottom:8px;
  }
  .dash-stat-sub{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .trend-flag{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:11px;
    padding:2px 6px;
    border-radius:6px;
  }
  .trend-flag.up{ color:#2E7D46; background:#E4F3E8; }
  .trend-flag.down{ color:var(--danger); background:var(--danger-soft); }
  .trend-flag.flat{ color:var(--ink-faint); background:var(--paper); }

  .subj-compare-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-lg);
    padding:16px;
  }
  .subj-compare-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .subj-compare-row:last-child{ margin-bottom:0; }
  .subj-compare-label{
    width:82px;
    flex-shrink:0;
    font-size:13px;
    font-weight:600;
  }
  .subj-compare-label.maths{ color:var(--maths); }
  .subj-compare-label.physics{ color:var(--physics); }
  .subj-compare-label.chem{ color:var(--chem); }
  .subj-compare-track{
    flex:1;
    height:10px;
    border-radius:999px;
    background:var(--paper);
    border:1px solid var(--rule);
    overflow:hidden;
  }
  .subj-compare-fill{
    height:100%;
    border-radius:999px;
    transition:width .4s ease;
  }
  .subj-compare-fill.maths{ background:var(--maths); }
  .subj-compare-fill.physics{ background:var(--physics); }
  .subj-compare-fill.chem{ background:var(--chem); }
  .subj-compare-pct{
    width:38px;
    flex-shrink:0;
    text-align:right;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);

  /* ---------- Per-student questions chart ---------- */
  .chart-card{ margin-top:10px; }
  .chart-svg-wrap{ width:100%; }
  .chart-svg-wrap svg{ width:100%; height:auto; display:block; }
  .chart-legend{
    display:flex;
    gap:16px;
    justify-content:center;
    margin-top:8px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .chart-legend-item{ display:flex; align-items:center; gap:5px; }
  .chart-legend-swatch{
    width:9px; height:9px;
    border-radius:2px;
    display:inline-block;
  }
  .chart-legend-swatch.maths{ background:var(--maths); }
  .chart-legend-swatch.physics{ background:var(--physics); }
  .chart-legend-swatch.chem{ background:var(--chem); }

  /* ---------- Toast (undo) ---------- */
  .toast-stack{
    position:fixed;
    left:0; right:0; bottom:16px;
    display:flex; flex-direction:column; align-items:center;
    gap:8px;
    z-index:200;
    pointer-events:none;
  }
  .toast{
    pointer-events:auto;
    background:var(--accent-dark);
    color:#fff;
    padding:11px 14px;
    border-radius:var(--radius);
    font-size:13px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:92vw;
  }
  .toast button{
    background:transparent;
    border:1px solid rgba(255,255,255,.5);
    color:#fff;
    font-weight:600;
    font-size:12px;
    padding:5px 10px;
    border-radius:7px;
    white-space:nowrap;
  }
  .toast button:hover{ background:rgba(255,255,255,.15); }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- Storage ---------------- */
  const LS_STUDENTS = 'st_students';
  const LS_HOMEWORK = 'st_homework';
  const LS_ERRORNOTES = 'st_errornotes';
  const LS_LAST_EXPORT = 'st_last_export_at';
  const BACKUP_SUFFIX = '__backup';
  const ALL_KEYS = [LS_STUDENTS, LS_HOMEWORK, LS_ERRORNOTES];

  let storageBroken = false;   // true if writes are failing (quota/unavailable)
  let dataRecovered = false;   // true if we had to fall back to a backup copy
  let hasUnexportedChanges = false; // true if data has changed since the last JSON export

  // Reads a key; if the primary copy is corrupt, falls back to the last-known-good
  // rolling backup instead of silently discarding data.
  function load(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(raw) return JSON.parse(raw);
    }catch(e){
      try{
        const backupRaw = localStorage.getItem(key + BACKUP_SUFFIX);
        if(backupRaw){
          dataRecovered = true;
          return JSON.parse(backupRaw);
        }
      }catch(e2){ /* backup also corrupt, fall through */ }
    }
    return fallback;
  }

  // Writes a key. Before overwriting, copies the current good value into a
  // shadow "__backup" key, so one bad/interrupted write can't destroy the
  // only copy of the data. Failures (e.g. storage full/unavailable) are
  // caught and surfaced via a banner instead of being silently swallowed.
  function save(key, val){
    try{
      const existing = localStorage.getItem(key);
      if(existing !== null){
        try{ localStorage.setItem(key + BACKUP_SUFFIX, existing); }catch(e){ /* best effort */ }
      }
      localStorage.setItem(key, JSON.stringify(val));
      if(storageBroken){ storageBroken = false; updateBanners(); }
      if(ALL_KEYS.includes(key)){
        if(!hasUnexportedChanges){
          hasUnexportedChanges = true;
          updateBanners();
        }
        scheduleAutosave();
      }
      return true;
    }catch(e){
      storageBroken = true;
      updateBanners();
      return false;
    }
  }

  let students = load(LS_STUDENTS, []);
  let homework = load(LS_HOMEWORK, []);
  let errorNotes = load(LS_ERRORNOTES, []);

  function saveStudents(){ save(LS_STUDENTS, students); }
  function saveHomework(){ save(LS_HOMEWORK, homework); }
  function saveErrorNotes(){ save(LS_ERRORNOTES, errorNotes); }
  function saveAll(){ saveStudents(); saveHomework(); saveErrorNotes(); }

  function uid(){ return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------------- Banners ---------------- */
  function bannerHtml(id, type, message, actions){
    const actionsHtml = (actions||[]).map(a => `<button class="btn btn-sm ${a.cls||'btn-ghost'}" data-banner-action="${a.action}">${a.label}</button>`).join('');
    return `<div class="banner show banner-${type}" id="${id}">
      <span>${message}</span>
      <div class="banner-actions">${actionsHtml}<button class="banner-dismiss" data-banner-action="dismiss-${id}" title="Dismiss">✕</button></div>
    </div>`;
  }

  function daysSince(ts){
    if(!ts) return Infinity;
    return (Date.now() - ts) / 86400000;
  }

  let exportReminderDismissed = false;

  function updateBanners(){
    const area = document.getElementById('bannerArea');
    if(!area) return;
    let html = '';

    if(storageBroken){
      html += bannerHtml('bannerStorage', 'error',
        '⚠ Changes are not saving — the browser storage for this tracker is full or unavailable. Export a backup now so nothing is lost, then try freeing up space or using a different browser.',
        [{action:'export', label:'Export Now', cls:'btn-danger'}]);
    }
    if(dataRecovered){
      html += bannerHtml('bannerRecovered', 'warn',
        'Some saved data looked corrupted on load, so the last known-good backup copy was restored automatically. Please check your records and export a fresh backup.',
        [{action:'export', label:'Export Now'}]);
    }
    if(!storageBroken && hasUnexportedChanges && students.length > 0 && autosaveState !== 'on'){
      html += bannerHtml('bannerUnsaved', 'warn',
        'You have changes since your last backup. Export before closing this tab so today\'s entries aren\'t lost.',
        [{action:'export', label:'Export Now'}]);
    } else if(!storageBroken && !exportReminderDismissed && (students.length > 0) && autosaveState !== 'on' && daysSince(Number(localStorage.getItem(LS_LAST_EXPORT))) > 7){
      html += bannerHtml('bannerRemind', 'info',
        'This tracker only saves data in this browser — nothing is backed up elsewhere. It\'s been a while since your last export; consider downloading a backup.',
        [{action:'export', label:'Export Now'}]);
    }
    if(autosaveState === 'needs-permission'){
      html += bannerHtml('bannerAutosavePerm', 'warn',
        `Autosave to "${autosaveHandle ? autosaveHandle.name : 'your file'}" needs permission again after reloading — click Reconnect near the search bar, or export manually for now.`,
        [{action:'export', label:'Export Now'}]);
    } else if(autosaveState === 'error'){
      html += bannerHtml('bannerAutosaveError', 'error',
        `⚠ Couldn't write to the autosave file — it may have been moved or deleted. Export a manual backup to be safe.`,
        [{action:'export', label:'Export Now', cls:'btn-danger'}]);
    }
    area.innerHTML = html;
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-banner-action]');
    if(!t) return;
    const action = t.dataset.bannerAction;
    if(action === 'export'){
      exportBackup();
    } else if(action.startsWith('dismiss-')){
      const id = action.slice('dismiss-'.length);
      if(id === 'bannerRemind') exportReminderDismissed = true;
      if(id === 'bannerRecovered') dataRecovered = false;
      updateBanners();
    }
  });

  /* ---------------- Export / Import ---------------- */
  function buildBackupPayload(){
    return {
      app: 'student-tracker-backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      students, homework, errorNotes
    };
  }

  function exportBackup(){
    const payload = buildBackupPayload();
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = todayISO();
    a.href = url;
    a.download = `student-tracker-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    try{ localStorage.setItem(LS_LAST_EXPORT, String(Date.now())); }catch(e){ /* ignore */ }
    exportReminderDismissed = false;
    hasUnexportedChanges = false;
    updateBanners();
  }

  // Warn before closing/navigating away if there are changes not yet in a
  // downloaded backup. Support varies by browser (and is unreliable on some
  // mobile browsers), so this is a helpful extra nudge, not a guarantee.
  window.addEventListener('beforeunload', e => {
    if(hasUnexportedChanges && autosaveState !== 'on'){
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  /* ---------------- Autosave to a local file ---------------- */
  // Uses the File System Access API (Chrome/Edge and similar Chromium
  // browsers only) to keep a chosen file on the user's own disk continuously
  // up to date — a frontend-only substitute for real backend persistence.
  // No server, no upload: the browser writes straight to a file the person
  // picked, and the file handle is remembered (via IndexedDB) between visits.
  const IDB_NAME = 'student_tracker_fsa';
  const IDB_STORE = 'handles';
  const IDB_KEY = 'autosave';
  const autosaveSupported = typeof window.showSaveFilePicker === 'function';

  let autosaveHandle = null;
  let autosaveState = 'off'; // 'off' | 'on' | 'needs-permission' | 'unsupported' | 'error'
  let autosaveWriteTimer = null;

  function idbOpen(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, val){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbDelete(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function setAutosaveState(state){
    autosaveState = state;
    const statusEl = document.getElementById('autosaveStatusText');
    const btnEl = document.getElementById('autosaveBtn');
    if(!statusEl || !btnEl) return;
    statusEl.className = 'autosave-status ' + state;
    const filename = autosaveHandle ? autosaveHandle.name : '';
    if(state === 'unsupported'){
      statusEl.textContent = 'Autosave to file needs Chrome or Edge — use Export Backup instead.';
      btnEl.style.display = 'none';
    } else if(state === 'off'){
      statusEl.textContent = 'Autosave to file: off';
      btnEl.textContent = 'Enable Autosave';
      btnEl.style.display = '';
    } else if(state === 'on'){
      statusEl.textContent = `Autosaving every change to "${filename}"`;
      btnEl.textContent = 'Disconnect';
      btnEl.style.display = '';
    } else if(state === 'needs-permission'){
      statusEl.textContent = `Autosave file "${filename}" needs permission again`;
      btnEl.textContent = 'Reconnect';
      btnEl.style.display = '';
    } else if(state === 'error'){
      statusEl.textContent = `Couldn't write to "${filename}" — check the file still exists`;
      btnEl.textContent = 'Disconnect';
      btnEl.style.display = '';
    }
    updateBanners();
  }

  async function writeAutosaveNow(){
    if(!autosaveHandle) return;
    try{
      const writable = await autosaveHandle.createWritable();
      await writable.write(JSON.stringify(buildBackupPayload(), null, 2));
      await writable.close();
      if(autosaveState !== 'on') setAutosaveState('on');
      else updateBanners();
    }catch(e){
      setAutosaveState('error');
    }
  }
  function scheduleAutosave(){
    if(!autosaveHandle || autosaveState === 'needs-permission') return;
    clearTimeout(autosaveWriteTimer);
    autosaveWriteTimer = setTimeout(writeAutosaveNow, 600);
  }

  async function connectAutosave(){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: 'student-tracker-autosave.json',
        types: [{ description: 'JSON backup', accept: {'application/json': ['.json']} }]
      });
      autosaveHandle = handle;
      await idbSet(IDB_KEY, handle);
      await writeAutosaveNow();
    }catch(e){
      // User cancelled the picker, or permission was denied — leave state as-is.
    }
  }

  async function disconnectAutosave(){
    autosaveHandle = null;
    try{ await idbDelete(IDB_KEY); }catch(e){ /* ignore */ }
    setAutosaveState('off');
  }

  async function reconnectAutosave(){
    if(!autosaveHandle) return;
    try{
      const perm = await autosaveHandle.requestPermission({ mode: 'readwrite' });
      if(perm === 'granted'){
        await writeAutosaveNow();
      } else {
        setAutosaveState('needs-permission');
      }
    }catch(e){
      setAutosaveState('needs-permission');
    }
  }

  document.getElementById('autosaveBtn').addEventListener('click', () => {
    if(autosaveState === 'off') connectAutosave();
    else if(autosaveState === 'on' || autosaveState === 'error') disconnectAutosave();
    else if(autosaveState === 'needs-permission') reconnectAutosave();
  });

  async function initAutosave(){
    if(!autosaveSupported){
      setAutosaveState('unsupported');
      return;
    }
    try{
      const handle = await idbGet(IDB_KEY);
      if(!handle){
        setAutosaveState('off');
        return;
      }
      autosaveHandle = handle;
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      setAutosaveState(perm === 'granted' ? 'on' : 'needs-permission');
    }catch(e){
      setAutosaveState('off');
    }
  }

  function isValidBackupShape(obj){
    return obj && typeof obj === 'object'
      && Array.isArray(obj.students)
      && Array.isArray(obj.homework)
      && Array.isArray(obj.errorNotes);
  }

  function importBackupFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ alert('That file is not a valid backup (could not parse JSON).'); return; }
      if(!isValidBackupShape(parsed)){
        alert('That file does not look like a Student Tracker backup.');
        return;
      }
      const replace = confirm(
        `Import backup from ${parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : 'unknown date'}?\n\n` +
        `This will REPLACE all current data (${students.length} student(s) currently) with the ${parsed.students.length} student(s) in this backup.\n\n` +
        `Click Cancel to keep your current data instead.`
      );
      if(!replace) return;
      students = parsed.students;
      homework = parsed.homework;
      errorNotes = parsed.errorNotes;
      saveAll();
      dataRecovered = false;
      updateBanners();
      showMain();
    };
    reader.onerror = () => alert('Could not read that file.');
    reader.readAsText(file);
  }

  /* ---------------- Export: Excel ---------------- */
  function studentName(id){
    const s = students.find(st => st.id === id);
    return s ? s.name : '(removed student)';
  }

  function getDaysInMonth(year, monthIndex0){
    return new Date(year, monthIndex0 + 1, 0).getDate();
  }

  // Builds a "students down the side, days across the top" grid for one
  // subject, for the calendar month that currentDate (the homework date
  // picker) falls in. Cell = questions-solved count if done, blank if not.
  function buildHomeworkGrid(subjectKey){
    const { year, monthIndex0, daysInMonth, mm } = monthContextFor(currentDate);

    const headers = ['Student'];
    for(let d = 1; d <= daysInMonth; d++) headers.push(String(d));

    const sortedStudents = students.slice().sort((a,b) => a.name.localeCompare(b.name));
    const rows = sortedStudents.map(stu => {
      const row = [stu.name];
      for(let d = 1; d <= daysInMonth; d++){
        const dateIso = `${year}-${mm}-${String(d).padStart(2,'0')}`;
        const rec = getHomework(stu.id, dateIso);
        if(rec && rec[subjectKey]){
          const count = rec[subjectKey + '_count'];
          row.push((count !== undefined && count !== null) ? count : '✓');
        } else {
          row.push('');
        }
      }
      return row;
    });

    return { headers, rows, year, monthIndex0, daysInMonth };
  }

  function exportExcel(){
    if(typeof XLSX === 'undefined'){
      alert('The Excel export library did not load (no internet connection?). Please try again.');
      return;
    }
    const wb = XLSX.utils.book_new();

    const studentRows = students.map(s => ({ Name: s.name }));
    const wsStudents = XLSX.utils.json_to_sheet(studentRows.length ? studentRows : [{Name:''}]);
    XLSX.utils.book_append_sheet(wb, wsStudents, 'Students');

    SUBJECTS.forEach(subj => {
      const grid = buildHomeworkGrid(subj.key);
      const aoa = [grid.headers, ...(grid.rows.length ? grid.rows : [['', ...Array(grid.daysInMonth).fill('')]])];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = [{ wch: 20 }, ...Array(grid.daysInMonth).fill({ wch: 5 })];
      XLSX.utils.book_append_sheet(wb, ws, subj.label);
    });

    const enSorted = errorNotes.slice().sort((a,b) => a.week === b.week ? studentName(a.student_id).localeCompare(studentName(b.student_id)) : a.week.localeCompare(b.week));
    const enRows = enSorted.map(r => ({
      Student: studentName(r.student_id),
      'Week Of': r.week,
      Maths: r.maths ? 'Yes' : 'No',
      Physics: r.physics ? 'Yes' : 'No',

  /* ---------------- Export: PDF ---------------- */
  // Minimal hand-rolled table renderer (no autoTable dependency) so this
  // works reliably against the exact jsPDF build loaded above.
  function drawPdfTable(doc, opts){
    const { startY, headers, rows, colWidths, marginLeft, title, fontSize } = opts;
    const pageHeight = doc.internal.pageSize.getHeight();
    const pageWidth = doc.internal.pageSize.getWidth();
    const bottomMargin = 30;
    const rowHeight = (fontSize || 9) + 6;
    const fs = fontSize || 9;
    let y = startY;

    function drawHeaderRow(){
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(fs);
      let x = marginLeft;
      headers.forEach((h, i) => {
        doc.text(String(h), x, y);
        x += colWidths[i];
      });
      y += 5;
      doc.setDrawColor(180);
      doc.line(marginLeft, y, marginLeft + colWidths.reduce((a,b)=>a+b,0), y);
      y += rowHeight - 5;
      doc.setFont('helvetica', 'normal');
    }

    if(title){
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text(title, marginLeft, y);
      y += 16;
    }
    drawHeaderRow();

    if(rows.length === 0){
      doc.setFontSize(fs);
      doc.setTextColor(120);
      doc.text('No records.', marginLeft, y);
      doc.setTextColor(0);
      y += rowHeight;
      return y;
    }

    doc.setFontSize(fs);
    rows.forEach(row => {
      if(y + rowHeight > pageHeight - bottomMargin){
        doc.addPage();
        y = 40;
        drawHeaderRow();
      }
      let x = marginLeft;
      row.forEach((cell, i) => {
        doc.text(String(cell), x, y, { maxWidth: colWidths[i] - 2 });
        x += colWidths[i];
      });
      y += rowHeight;
    });

    return y;
  }

  function exportPdf(){
    if(typeof jspdf === 'undefined' || !jspdf.jsPDF){
      alert('The PDF export library did not load (no internet connection?). Please try again.');
      return;
    }
    const { jsPDF } = jspdf;

    // Landscape, since each subject's grid can have up to 31 day columns.
    const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'landscape' });
    const marginLeft = 30;
    const pageWidth = doc.internal.pageSize.getWidth();
    const nameColWidth = 100;

    SUBJECTS.forEach((subj, idx) => {
      if(idx > 0) doc.addPage();
      const grid = buildHomeworkGrid(subj.key);
      const monthLabel = `${MONTHS[grid.monthIndex0]} ${grid.year}`;
      const dayColWidth = Math.max(16, (pageWidth - marginLeft*2 - nameColWidth) / grid.daysInMonth);
      const colWidths = [nameColWidth, ...Array(grid.daysInMonth).fill(dayColWidth)];
      const headers = ['Student', ...grid.headers.slice(1)];

      let y = 40;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.text(`${subj.label} — Homework (${monthLabel})`, marginLeft, y);
      y += 22;

      drawPdfTable(doc, {
        startY: y,
        headers,
        rows: grid.rows,
        colWidths,
        marginLeft,
        fontSize: grid.daysInMonth > 26 ? 7 : 8
      });
    });

    // Error notes: kept as a simple weekly log (portrait-style content on a
    // landscape page), since it's tracked per-week rather than per-day.
    doc.addPage();
    let y2 = 40;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('Error Notes Log', marginLeft, y2);
    y2 += 10;

    doc.setFontSize(10);
    doc.setTextColor(110);
    doc.text(`Generated ${new Date().toLocaleString()} — ${students.length} student(s)`, marginLeft, y2 + 12);
    doc.setTextColor(0);

    const enRows = enSorted.map(r => [studentName(r.student_id), r.week, r.maths ? 'Yes' : 'No', r.physics ? 'Yes' : 'No', r.chemistry ? 'Yes' : 'No']);
    drawPdfTable(doc, {
      startY: y2,
      headers: ['Student', 'Week Of', 'Maths', 'Physics', 'Chemistry'],
      rows: enRows,
      colWidths: [200, 100, 80, 80, 90],
      marginLeft
    });

    doc.save(`student-tracker-${todayISO()}.pdf`);
  }

  /* ---------------- Undo toast ---------------- */
  function showToast(message, onUndo, duration){
    duration = duration || 8000;
    const stack = document.getElementById('toastStack');
    const id = 'toast_' + Date.now();
    const el = document.createElement('div');
    el.className = 'toast';
    el.id = id;
    el.innerHTML = `<span>${message}</span>` + (onUndo ? `<button data-undo>Undo</button>` : '');
    stack.appendChild(el);
    let done = false;
    const finish = () => {
      if(done) return;
      done = true;
      el.remove();
    };
    if(onUndo){
      el.querySelector('[data-undo]').addEventListener('click', () => {
        onUndo();
        finish();
      });
    }
    setTimeout(finish, duration);
  }

  /* ---------------- Date helpers ---------------- */
  function todayISO(){
    const d = new Date();
    return isoFromDate(d);
  }
  function isoFromDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function dateFromISO(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function getMonday(iso){
    const d = dateFromISO(iso);
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = (day === 0 ? -6 : 1 - day); // shift to Monday
    d.setDate(d.getDate() + diff);
    return isoFromDate(d);
  }
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatShort(iso){
    const d = dateFromISO(iso);
    return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  }
  function formatWeekRange(mondayIso){
    const start = dateFromISO(mondayIso);
    const end = new Date(start); end.setDate(end.getDate()+6);
    const sM = MONTHS[start.getMonth()], eM = MONTHS[end.getMonth()];
    if(sM === eM){
      return `${sM} ${start.getDate()} – ${end.getDate()}`;
    }
    return `${sM} ${start.getDate()} – ${eM} ${end.getDate()}`;
  }
  // All 7 ISO dates (Mon..Sun) for the week starting at mondayIso.
  function weekDatesFrom(mondayIso){
    const start = dateFromISO(mondayIso);
    const out = [];
    for(let i = 0; i < 7; i++){
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      out.push(isoFromDate(d));
    }
    return out;
  }
  // Shared context for "this calendar month, up to today" calculations
  // (used by the homework grid, low performers, and subject comparison).
  function monthContextFor(dateIso){
    const ref = dateFromISO(dateIso);
    const year = ref.getFullYear();
    const monthIndex0 = ref.getMonth();
    const daysInMonth = getDaysInMonth(year, monthIndex0);
    const mm = String(monthIndex0 + 1).padStart(2, '0');
    const today = new Date();
    let daysElapsed;
    if(year < today.getFullYear() || (year === today.getFullYear() && monthIndex0 < today.getMonth())){
      daysElapsed = daysInMonth;
    } else if(year === today.getFullYear() && monthIndex0 === today.getMonth()){
      daysElapsed = today.getDate();
    } else {
      daysElapsed = 0;
    }
    return { year, monthIndex0, daysInMonth, mm, daysElapsed, monthLabel: `${MONTHS[monthIndex0]} ${year}` };
  }

  // Line chart (Maths/Physics/Chemistry as three colored lines) of questions
  // solved over the last 14 calendar days, anchored to today regardless of
  // the date picker.
  function buildQuestionsChartSvg(stu){
    const days = [];
    const anchor = new Date();
    for(let i = 13; i >= 0; i--){
      const d = new Date(anchor);
      d.setDate(d.getDate() - i);
      const iso = isoFromDate(d);
      const rec = getHomework(stu.id, iso);
      const m = rec && rec.maths ? (rec.maths_count || 0) : 0;
      const p = rec && rec.physics ? (rec.physics_count || 0) : 0;
      const c = rec && rec.chemistry ? (rec.chemistry_count || 0) : 0;
      days.push({ day: d.getDate(), m, p, c });
    }
    const maxVal = Math.max(1, ...days.map(d => Math.max(d.m, d.p, d.c)));

    const chartW = 320, chartH = 150, padL = 8, padR = 8, padT = 14, padB = 20;
    const plotW = chartW - padL - padR;
    const plotH = chartH - padT - padB;
    const baseline = padT + plotH;
    const stepX = days.length > 1 ? plotW / (days.length - 1) : 0;

    const xAt = i => padL + i * stepX;
    const yAt = v => baseline - (v / maxVal) * plotH;

    // Light horizontal gridlines for a readable scale (25/50/75/100%).
    const gridlines = [0.25, 0.5, 0.75, 1].map(f => {
      const y = (baseline - f * plotH).toFixed(1);
      return `<line x1="${padL}" y1="${y}" x2="${chartW-padR}" y2="${y}" stroke="var(--rule)" stroke-width="0.5" stroke-dasharray="2,3"></line>`;
    }).join('');

    function seriesSvg(key, color){
      const points = days.map((d, i) => `${xAt(i).toFixed(1)},${yAt(d[key]).toFixed(1)}`).join(' ');
      const dots = days.map((d, i) => {
        const x = xAt(i).toFixed(1), y = yAt(d[key]).toFixed(1);
        const subjName = key === 'm' ? 'Maths' : key === 'p' ? 'Physics' : 'Chemistry';
        return `<circle cx="${x}" cy="${y}" r="2.2" fill="${color}"><title>${subjName}, day ${d.day}: ${d[key]} solved</title></circle>`;
      }).join('');
      return `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>${dots}`;
    }

    const dayLabels = days.map((d, i) => {
      if(i % 2 !== 0 && days.length > 10) return ''; // thin labels out on narrow charts
      return `<text x="${xAt(i).toFixed(1)}" y="${chartH - 6}" font-size="7" text-anchor="middle" fill="var(--ink-faint)">${d.day}</text>`;
    }).join('');

    return `<svg viewBox="0 0 ${chartW} ${chartH}" xmlns="http://www.w3.org/2000/svg">
      ${gridlines}
      <line x1="${padL}" y1="${baseline}" x2="${chartW-padR}" y2="${baseline}" stroke="var(--rule)" stroke-width="1"></line>
      ${seriesSvg('m', 'var(--maths)')}
      ${seriesSvg('p', 'var(--physics)')}
      ${seriesSvg('c', 'var(--chem)')}
      ${dayLabels}
    </svg>`;
  }

  function pendingSubjectCardHtml(subj, pendingStudents){
    const listHtml = pendingStudents.length
      ? `<ul class="pending-list">${pendingStudents.map(s => `<li>${escapeHtml(s.name)}</li>`).join('')}</ul>`
      : `<div class="pending-all-clear">All caught up 🎉</div>`;
    return `
      <div class="pending-subject-card ${subj.cls}">
        <div class="pending-subject-head">
          <div class="pending-subject-title">${subj.label}</div>
          <div class="pending-count">${pendingStudents.length} pending</div>
        </div>
        ${listHtml}
      </div>`;
  }

  function renderPending(){
    const pendingEl = document.getElementById('pendingView');

    if(students.length === 0){
      pendingEl.innerHTML = `
        <div class="pending-header">
          <button class="back-link" data-action="back">← Back</button>
          <div class="records-title">Today's Pending</div>
        </div>
        <div class="empty-state">
          <div class="big">No students yet</div>
          <div>Add students on the main page first.</div>
        </div>`;
      return;
    }

    const hwRecords = homework.filter(r => r.date === currentDate);
    const enRecords = errorNotes.filter(r => r.week === currentWeek);

    const hwCards = SUBJECTS.map(subj => pendingSubjectCardHtml(subj, pendingFor(hwRecords, subj.key))).join('');
    const enCards = SUBJECTS.map(subj => pendingSubjectCardHtml(subj, pendingFor(enRecords, subj.key))).join('');

    pendingEl.innerHTML = `
      <div class="pending-header">
        <button class="back-link" data-action="back">← Back</button>
        <div class="records-title">Today's Pending</div>
      </div>
      <p class="pending-sub">Students who don't yet have a ✓ for the selected date / week, by subject.</p>

      <div class="pending-section-title">Homework Pending — ${formatShort(currentDate)}</div>
      ${hwCards}

      <div class="pending-section-title">Error Notes Pending — ${formatWeekRange(currentWeek)}</div>
      ${enCards}
    `;
  }

  function showPending(){
    view = 'pending';
    document.getElementById('mainView').style.display = 'none';
    document.getElementById('recordsView').style.display = 'none';
    document.getElementById('pendingView').style.display = '';
    document.getElementById('lowPerfView').style.display = 'none';
    document.getElementById('dashboardView').style.display = 'none';
    renderPending();
  }

  /* ---------------- Rendering: low performers page ---------------- */
  const LS_LOW_PERF_THRESHOLD = 'st_low_perf_threshold';
  let lowPerfThreshold = (() => {
    let v;
    try{ v = Number(localStorage.getItem(LS_LOW_PERF_THRESHOLD)); }catch(e){ v = NaN; }
    return Number.isFinite(v) && v >= 0 && v <= 100 ? v : 70;
  })();

  // Completion is measured over the calendar month of the currently
  // selected homework date, up to today (or the whole month if it's past).
  function computeLowPerfData(threshold){
    const { year, monthIndex0, daysInMonth, mm, daysElapsed } = monthContextFor(currentDate);

    const results = students.map(stu => {
      let mDone=0, pDone=0, cDone=0, mQ=0, pQ=0, cQ=0;
      for(let d = 1; d <= daysElapsed; d++){
        const dateIso = `${year}-${mm}-${String(d).padStart(2,'0')}`;
        const rec = getHomework(stu.id, dateIso);
        if(rec){
          if(rec.maths){ mDone++; mQ += (rec.maths_count || 0); }
          if(rec.physics){ pDone++; pQ += (rec.physics_count || 0); }
          if(rec.chemistry){ cDone++; cQ += (rec.chemistry_count || 0); }
        }
      }
      const totalDone = mDone + pDone + cDone;
      const totalPossible = daysElapsed * 3;
      const percent = totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : null;
      return {
        student: stu,
        percent,
        mPercent: daysElapsed > 0 ? Math.round((mDone / daysElapsed) * 100) : null,
        pPercent: daysElapsed > 0 ? Math.round((pDone / daysElapsed) * 100) : null,
        cPercent: daysElapsed > 0 ? Math.round((cDone / daysElapsed) * 100) : null,
        totalQuestions: mQ + pQ + cQ,
        flagged: percent !== null && percent < threshold
      };
    });

    results.sort((a, b) => {
      if(a.percent === null && b.percent === null) return 0;
      if(a.percent === null) return 1;
      if(b.percent === null) return -1;
      return a.percent - b.percent;
    });

    return { results, daysElapsed, daysInMonth, year, monthIndex0 };
  }

  function renderLowPerformers(){
    const el = document.getElementById('lowPerfView');

    if(students.length === 0){
      el.innerHTML = `
        <div class="pending-header">
          <button class="back-link" data-action="back">← Back</button>
          <div class="records-title">Low Performers</div>
        </div>
        <div class="empty-state">
          <div class="big">No students yet</div>
          <div>Add students on the main page first.</div>
        </div>`;
      return;
    }

    const { results, daysElapsed, daysInMonth, year, monthIndex0 } = computeLowPerfData(lowPerfThreshold);
    const monthLabel = `${MONTHS[monthIndex0]} ${year}`;

    if(daysElapsed === 0){
      el.innerHTML = `
        <div class="pending-header">
          <button class="back-link" data-action="back">← Back</button>
          <div class="records-title">Low Performers</div>
        </div>
        <p class="pending-sub">${monthLabel} hasn't started yet as of the selected homework date, so there's no data to evaluate.</p>`;
      return;
    }

    const flaggedCount = results.filter(r => r.flagged).length;

    const rowsHtml = results.map(r => `
      <tr class="${r.flagged ? 'flag-row' : ''}">
        <td>${r.flagged ? '🚩 ' : ''}${escapeHtml(r.student.name)}</td>
        <td>${r.percent}%</td>
        <td>${r.mPercent}%</td>
        <td>${r.pPercent}%</td>
        <td>${r.cPercent}%</td>
        <td>${r.totalQuestions}</td>
      </tr>`).join('');

    el.innerHTML = `
      <div class="pending-header">
        <button class="back-link" data-action="back">← Back</button>
        <div class="records-title">Low Performers</div>
      </div>
      <p class="pending-sub">
        Homework completion for ${monthLabel}, through day ${daysElapsed} of ${daysInMonth}.
        ${flaggedCount} of ${results.length} student(s) below the threshold.
      </p>
      <div class="field-group" style="margin-bottom:16px;">
        <label for="lowPerfThresholdInput" style="font-size:13px; color:var(--ink-soft);">Flag below</label>
        <input type="number" id="lowPerfThresholdInput" min="0" max="100" step="5" value="${lowPerfThreshold}" style="width:70px;">
        <span style="font-size:13px; color:var(--ink-soft);">% completion</span>
      </div>
      <div class="table-wrap">
        <table class="reg-table">
          <thead><tr><th>Student</th><th>Overall</th><th>Maths</th><th>Physics</th><th>Chemistry</th><th>Questions Solved</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;

    document.getElementById('lowPerfThresholdInput').addEventListener('change', e => {
      let v = Number(e.target.value);
      if(!Number.isFinite(v)) v = 70;
      v = Math.max(0, Math.min(100, Math.round(v)));
      lowPerfThreshold = v;
      try{ localStorage.setItem(LS_LOW_PERF_THRESHOLD, String(v)); }catch(err){ /* ignore */ }
      renderLowPerformers();
    });
  }

  function showLowPerformers(){
    view = 'lowperf';
    document.getElementById('mainView').style.display = 'none';
    document.getElementById('recordsView').style.display = 'none';
    document.getElementById('pendingView').style.display = 'none';
    document.getElementById('lowPerfView').style.display = '';
    document.getElementById('dashboardView').style.display = 'none';
    renderLowPerformers();
  }
  document.getElementById('lowPerfBtn').addEventListener('click', () => {
    closeMenu();
    showLowPerformers();
  });

  /* ---------------- Dashboard ---------------- */
  function classCompletionFor(dateIso){
    if(students.length === 0) return null;
    let done = 0;
    students.forEach(stu => {
      const rec = getHomework(stu.id, dateIso);
      if(rec){
        if(rec.maths) done++;
        if(rec.physics) done++;
        if(rec.chemistry) done++;
      }
    });
    return Math.round((done / (students.length * 3)) * 100);
  }

  function avgQuestionsForWeek(mondayIso){
    if(students.length === 0) return null;
    const dates = weekDatesFrom(mondayIso);
    let total = 0;
    students.forEach(stu => {
      dates.forEach(dateIso => {
        const rec = getHomework(stu.id, dateIso);
        if(rec){
          total += (rec.maths_count || 0) + (rec.physics_count || 0) + (rec.chemistry_count || 0);
        }
      });
    });
    return total / students.length;
  }

  function computeClassStats(){
    const todayCompletion = classCompletionFor(currentDate);
    const thisWeekAvg = avgQuestionsForWeek(currentWeek);
    const prevMonday = (() => {
      const d = dateFromISO(currentWeek);
      d.setDate(d.getDate() - 7);
      return isoFromDate(d);
    })();
    const prevWeekAvg = avgQuestionsForWeek(prevMonday);
    let trend = null;
    if(thisWeekAvg !== null && prevWeekAvg !== null){
      if(prevWeekAvg === 0){
        trend = thisWeekAvg > 0 ? { dir: 'up', pct: null } : { dir: 'flat', pct: 0 };
      } else {
        const pct = Math.round(((thisWeekAvg - prevWeekAvg) / prevWeekAvg) * 100);
        trend = { dir: pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat', pct };
      }
    }
    return { todayCompletion, thisWeekAvg, prevWeekAvg, trend };
  }

  function computeSubjectComparison(){
    const { year, monthIndex0, mm, daysElapsed, monthLabel } = monthContextFor(currentDate);
    const totals = { maths: 0, physics: 0, chemistry: 0 };
    const possible = students.length * daysElapsed;

    if(possible > 0){
      students.forEach(stu => {
        for(let d = 1; d <= daysElapsed; d++){
          const dateIso = `${year}-${mm}-${String(d).padStart(2,'0')}`;
          const rec = getHomework(stu.id, dateIso);
          if(rec){
            if(rec.maths) totals.maths++;
            if(rec.physics) totals.physics++;
            if(rec.chemistry) totals.chemistry++;
          }
        }
      });
    }

    const results = SUBJECTS.map(subj => ({
      ...subj,
      percent: possible > 0 ? Math.round((totals[subj.key] / possible) * 100) : null
    }));
    results.sort((a, b) => (a.percent ?? 101) - (b.percent ?? 101));

    return { results, daysElapsed, monthLabel };
  }

  function trendHtml(trend){
    if(!trend) return '<span class="trend-flag flat">–</span>';
    if(trend.dir === 'up') return `<span class="trend-flag up">▲ ${trend.pct === null ? 'new' : trend.pct + '%'}</span>`;
    if(trend.dir === 'down') return `<span class="trend-flag down">▼ ${Math.abs(trend.pct)}%</span>`;
    return '<span class="trend-flag flat">– no change</span>';
  }

  function renderDashboard(){
    const el = document.getElementById('dashboardView');

    if(students.length === 0){
      el.innerHTML = `
        <div class="pending-header">
          <button class="back-link" data-action="back">← Back</button>
          <div class="records-title">Dashboard</div>
        </div>
        <div class="empty-state">
          <div class="big">No students yet</div>
          <div>Add students on the main page first.</div>
        </div>`;
      return;
    }

    const stats = computeClassStats();
    const subjComp = computeSubjectComparison();

    const todayLabel = formatShort(currentDate);
    const todayPctHtml = stats.todayCompletion === null ? '—' : `${stats.todayCompletion}%`;
    const weekAvgHtml = stats.thisWeekAvg === null ? '—' : stats.thisWeekAvg.toFixed(1);

    const subjBarsHtml = subjComp.daysElapsed === 0
      ? `<div class="pending-all-clear">No data yet for ${subjComp.monthLabel}.</div>`
      : subjComp.results.map((r, i) => `
        <div class="subj-compare-row">
          <div class="subj-compare-label ${r.cls}">
            ${i === 0 ? '🔻 ' : ''}${r.label}
          </div>
          <div class="subj-compare-track">
            <div class="subj-compare-fill ${r.cls}" style="width:${r.percent}%"></div>
          </div>
          <div class="subj-compare-pct">${r.percent}%</div>
        </div>`).join('');

    el.innerHTML = `
      <div class="pending-header">
        <button class="back-link" data-action="back">← Back</button>
        <div class="records-title">Dashboard</div>
      </div>

      <div class="dash-stats-row">
        <div class="dash-stat-card">
          <div class="dash-stat-label">Today's Completion</div>
          <div class="dash-stat-value">${todayPctHtml}</div>
          <div class="dash-stat-sub">${escapeHtml(todayLabel)}, homework across all subjects</div>
        </div>
        <div class="dash-stat-card">
          <div class="dash-stat-label">Avg Questions / Student</div>
          <div class="dash-stat-value">${weekAvgHtml}</div>
          <div class="dash-stat-sub">Week of ${formatWeekRange(currentWeek)} ${trendHtml(stats.trend)}</div>
        </div>
      </div>

      <div class="pending-section-title">Subject Comparison — ${subjComp.monthLabel}</div>
      <p class="pending-sub">Class-wide homework completion by subject, through today. The lowest is flagged 🔻.</p>
      <div class="subj-compare-card">
        ${subjBarsHtml}
      </div>
    `;
  }

  function showDashboard(){
    view = 'dashboard';
    document.getElementById('mainView').style.display = 'none';
    document.getElementById('recordsView').style.display = 'none';
    document.getElementById('pendingView').style.display = 'none';
    document.getElementById('lowPerfView').style.display = 'none';
    document.getElementById('dashboardView').style.display = '';
    renderDashboard();
  }
  document.getElementById('dashboardBtn').addEventListener('click', () => {
    closeMenu();
    showDashboard();
  });

  /* ---------------- Header controls ---------------- */
  function updateWeekRangeDisplay(){
    document.getElementById('weekRangeDisplay').textContent = formatWeekRange(currentWeek);
  }

  document.getElementById('hwDate').value = currentDate;
  document.getElementById('enWeekPicker').value = currentWeek;
  updateWeekRangeDisplay();

  document.getElementById('hwDate').addEventListener('change', e => {
    currentDate = e.target.value || todayISO();
    if(view === 'main') renderMain();
    else if(view === 'pending') renderPending();
    else if(view === 'lowperf') renderLowPerformers();
    else if(view === 'dashboard') renderDashboard();
  });

  document.getElementById('enWeekPicker').addEventListener('change', e => {
    const val = e.target.value || todayISO();
    currentWeek = getMonday(val);
    updateWeekRangeDisplay();
    if(view === 'main') renderMain();
    else if(view === 'pending') renderPending();
    else if(view === 'dashboard') renderDashboard();
  });

  function addStudent(){
    const input = document.getElementById('newStudentName');
    const name = input.value.trim();
    if(!name) return;
    students.push({ id: uid(), name: name });
    saveStudents();
    input.value = '';
    renderMain();
  }
  document.getElementById('addStudentBtn').addEventListener('click', addStudent);
  document.getElementById('newStudentName').addEventListener('keydown', e => {
    if(e.key === 'Enter') addStudent();
  });

  /* ---------------- Search ---------------- */
  document.getElementById('studentSearch').addEventListener('input', e => {
    searchQuery = e.target.value;
    if(view === 'main') renderMain();
  });

  /* ---------------- Menu panel (collapsible) ---------------- */
  const menuPanel = document.getElementById('menuPanel');
  const menuToggleBtn = document.getElementById('menuToggleBtn');

  function openMenu(){
    menuPanel.classList.add('open');
    menuToggleBtn.setAttribute('aria-expanded', 'true');
  }
  function closeMenu(){
    menuPanel.classList.remove('open');
    menuToggleBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleMenu(){
    if(menuPanel.classList.contains('open')) closeMenu();
    else openMenu();
  }
  menuToggleBtn.addEventListener('click', toggleMenu);

  // Close the menu if the person clicks/taps outside it (but not on the toggle itself).
  document.addEventListener('click', e => {
    if(!menuPanel.classList.contains('open')) return;
    if(menuPanel.contains(e.target) || menuToggleBtn.contains(e.target)) return;
    closeMenu();
  });

  /* ---------------- Pending page nav ---------------- */
  document.getElementById('pendingBtn').addEventListener('click', () => {
    closeMenu();
    showPending();
  });

  /* ---------------- Remove modal ---------------- */
  const removeModal = document.getElementById('removeModal');
  function openRemoveModal(studentId){
    const stu = students.find(s => s.id === studentId);
    if(!stu) return;
    pendingRemoveId = studentId;
    document.getElementById('removeModalName').textContent = stu.name;
    removeModal.classList.add('open');
  }
  function closeRemoveModal(){
    removeModal.classList.remove('open');
    pendingRemoveId = null;
  }
  document.getElementById('cancelRemoveBtn').addEventListener('click', closeRemoveModal);
  document.getElementById('confirmRemoveBtn').addEventListener('click', () => {
    if(!pendingRemoveId) return;
    const removedId = pendingRemoveId;
    // Snapshot everything belonging to this student so the deletion can be undone.
    const removedStudent = students.find(s => s.id === removedId);
    const removedHomework = homework.filter(r => r.student_id === removedId);
    const removedErrorNotes = errorNotes.filter(r => r.student_id === removedId);
    const removedIndex = students.findIndex(s => s.id === removedId);

    students = students.filter(s => s.id !== removedId);
    homework = homework.filter(r => r.student_id !== removedId);
    errorNotes = errorNotes.filter(r => r.student_id !== removedId);
    saveStudents(); saveHomework(); saveErrorNotes();
    closeRemoveModal();
    renderMain();

    if(removedStudent){
      showToast(`Removed ${escapeHtml(removedStudent.name)}.`, () => {
        students.splice(Math.min(removedIndex, students.length), 0, removedStudent);
        homework = homework.concat(removedHomework);
        errorNotes = errorNotes.concat(removedErrorNotes);
        saveStudents(); saveHomework(); saveErrorNotes();
        if(view === 'main') renderMain();
      });
    }
  });
  removeModal.addEventListener('click', e => {
    if(e.target === removeModal) closeRemoveModal();
  });

  /* ---------------- Homework count modal ---------------- */
  const countModal = document.getElementById('countModal');
  const countModalInput = document.getElementById('countModalInput');
  const countModalError = document.getElementById('countModalError');
  const countDecBtn = document.getElementById('countDecBtn');
  const countIncBtn = document.getElementById('countIncBtn');
  const countQuickRow = document.getElementById('countQuickRow');
  let pendingCount = null; // { studentId, date, subject }

  // Keeps the stepper buttons and quick-pick chips in sync with whatever
  // value is currently in the input (typed, stepped, or quick-picked).
  function syncCountUI(){
    const raw = countModalInput.value.trim();
    const n = raw === '' ? null : Number(raw);
    const valid = n !== null && Number.isInteger(n) && n >= 0;

    countDecBtn.disabled = !valid || n <= 0;

    countQuickRow.querySelectorAll('.count-quick-btn').forEach(btn => {
      btn.classList.toggle('selected', valid && Number(btn.dataset.quick) === n);
    });
  }

  function openCountModal(studentId, date, subject, subjectLabel){
    const stu = students.find(s => s.id === studentId);
    if(!stu) return;
    pendingCount = { studentId, date, subject };
    document.getElementById('countModalName').textContent = stu.name;
    document.getElementById('countModalSubject').textContent = subjectLabel;
    countModalInput.value = '';
    countModalError.classList.remove('show');
    syncCountUI();
    countModal.classList.add('open');
    setTimeout(() => countModalInput.focus(), 30);
  }
  function closeCountModal(){
    countModal.classList.remove('open');
    countModalError.classList.remove('show');
    pendingCount = null;
  }

  function confirmCount(){
    if(!pendingCount) return;
    const raw = countModalInput.value.trim();
    const n = Number(raw);
    const valid = raw !== '' && Number.isInteger(n) && n >= 0;
    if(!valid){
      countModalError.classList.add('show');
      countModalInput.focus();
      return;
    }
    setHomework(pendingCount.studentId, pendingCount.date, pendingCount.subject, true, n);
    closeCountModal();
    if(view === 'main') renderMain();
  }

  countModalInput.addEventListener('input', () => {
    countModalError.classList.remove('show');
    syncCountUI();
  });

  countDecBtn.addEventListener('click', () => {
    const n = Number(countModalInput.value) || 0;
    countModalInput.value = Math.max(0, n - 1);
    countModalError.classList.remove('show');
    syncCountUI();
  });
  countIncBtn.addEventListener('click', () => {
    const n = Number(countModalInput.value) || 0;
    countModalInput.value = n + 1;
    countModalError.classList.remove('show');
    syncCountUI();
  });
  countQuickRow.addEventListener('click', e => {
    const btn = e.target.closest('.count-quick-btn');
    if(!btn) return;
    countModalInput.value = btn.dataset.quick;
    countModalError.classList.remove('show');
    syncCountUI();
  });

  document.getElementById('cancelCountBtn').addEventListener('click', closeCountModal);
  document.getElementById('confirmCountBtn').addEventListener('click', confirmCount);
  countModalInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); confirmCount(); }
  });
  countModal.addEventListener('click', e => {
    if(e.target === countModal) closeCountModal();
  });

  /* ---------------- Name editing ---------------- */
  function commitNameEdit(studentId, newName){
    const stu = students.find(s => s.id === studentId);
    if(stu){
      const trimmed = newName.trim();
      if(trimmed) stu.name = trimmed;
      saveStudents();
    }
    editingStudentId = null;
    renderMain();
  }

  /* ---------------- Event delegation ---------------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;
    const studentId = t.dataset.student;

    if(action === 'toggle-hw'){
      const subject = t.dataset.subject;
      const rec = getHomework(studentId, currentDate);
      const current = rec ? rec[subject] : false;
      if(current){
        // Marking as not done — no count needed, just clear it.
        setHomework(studentId, currentDate, subject, false);
        renderMain();
      } else {
        const label = subject === 'maths' ? 'Maths' : subject === 'physics' ? 'Physics' : 'Chemistry';
        openCountModal(studentId, currentDate, subject, label);
      }
    } else if(action === 'toggle-en'){
      const subject = t.dataset.subject;
      const rec = getErrorNote(studentId, currentWeek);
      const current = rec ? rec[subject] : false;
      setErrorNote(studentId, currentWeek, subject, !current);
      renderMain();
    } else if(action === 'open-records'){
      showRecords(studentId);
    } else if(action === 'remove-student'){
      openRemoveModal(studentId);
    } else if(action === 'edit-name'){
      editingStudentId = studentId;
      renderMain();
    } else if(action === 'back'){
      showMain();
    }
  });

  document.addEventListener('keydown', e => {
    if(e.target && e.target.id === 'nameEditInput'){
      if(e.key === 'Enter'){
        commitNameEdit(editingStudentId, e.target.value);
      } else if(e.key === 'Escape'){
        editingStudentId = null;
        renderMain();
      }
    }
  });
  document.addEventListener('blur', e => {
    if(e.target && e.target.id === 'nameEditInput'){
      commitNameEdit(editingStudentId, e.target.value);
    }
  }, true);

  /* ---------------- Init ---------------- */
  renderMain();
  updateBanners();
  initAutosave();
})();
</script>
</body>
